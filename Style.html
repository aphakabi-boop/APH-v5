<style>

/* ========================================= */
/* CSS UNTUK PORTAL BERANDA (LANDING PAGE) */
/* ========================================= */
#landing-page {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  /* Gambar Background dari Unsplash + Efek Kaca Film Gelap */
  background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://raw.githubusercontent.com/aphakabi-boop/Web-Assets/main/dan-meyers-IQVFVH0ajag-unsplash.jpg');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.landing-content {
  text-align: center;
  color: white;
  padding: 40px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px); /* Efek Kaca Transparan */
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  border: 1px solid rgba(255, 255, 255, 0.18);
  max-width: 90%;
}

.landing-content h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.landing-content p {
  font-size: 1.2rem;
  margin-bottom: 30px;
}

.button-group {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn-portal {
  padding: 15px 30px;
  font-size: 1.2rem;
  font-weight: bold;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  color: white;
}

.btn-portal:hover {
  transform: translateY(-5px); /* Efek tombol membal/terangkat */
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.btn-p4 { background: #2ecc71; }
.btn-p4:hover { background: #27ae60; }

.btn-ppht { background: #3498db; }
.btn-ppht:hover { background: #2980b9; }

/* Animasi Transisi Halus Menuju Form */
.fade-out { animation: fadeOut 0.5s forwards; }
.fade-in { animation: fadeIn 0.5s forwards; }

@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }


  /* 1. MENGAMBIL FONT 'INTER' - Sangat modern & bersih */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
  }

/* 2. BACKGROUND MESH BERGERAK - TEMPAHAN STUDIO GHIBLI VIBES */
  body {
    margin: 0; 
    padding: 35px 20px 60px 20px;
    font-size: 16px;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
    
    /* Perpaduan warna ala pemandangan alam Studio Ghibli (Hijau rumput pastel, langit cerah, & hangat keemasan) */
    background: linear-gradient(-45deg, #c7d2fe, #a7f3d0, #fef08a, #fed7aa);
    background-size: 400% 400%;
    animation: gradientBG 20s ease infinite; /* Dibuat sedikit lebih lambat agar terasa tenang dan santai */
    min-height: 100vh;
  }

  /* Animasi pergerakan warna background */
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 3. HEADER MELAYANG DENGAN EFEK KACA */
  .header-title {
    background: 
      linear-gradient(to bottom, rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.7)), 
      url('https://aasgiant2406.github.io/aph-assets/Cover_JudulRev.jpg') no-repeat center center;
    background-size: cover;
    padding: 40px;
    border-radius: 24px 24px 0 0; 
    text-align: center;
    width: 100%;   
    max-width: 680px; 
    margin: 20px auto 0 auto; 
    height: 180px;       
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    position: relative;
    z-index: 2;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: none;
  }

  .header-title h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    color: #ffffff; 
    letter-spacing: -0.5px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5); 
  }

  /* 4. WADAH FORM GLASSMORPHISM UTAMA */
  form {
    background: rgba(255, 255, 255, 0.45); 
    backdrop-filter: blur(20px); 
    -webkit-backdrop-filter: blur(20px); 
    padding: 40px;
    border-radius: 0 0 24px 24px;
    max-width: 680px;
    margin: 0 auto;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.5); 
    border-top: none;
    position: relative;
    z-index: 1;
  }

  /* 5. TYPOGRAPHY & LABEL */
  label {
    display: block;
    margin-top: 24px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #334155; 
    text-transform: uppercase; 
    letter-spacing: 0.5px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8); 
  }

  /* 6. INPUT & SELECT TEMBUS PANDANG */
  input, select {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.5); 
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    font-size: 15px;
    color: #0f172a;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
  }

  input:focus, select:focus {
    background: rgba(255, 255, 255, 0.85); 
    border-color: #10b981; 
    outline: none;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2), inset 0 1px 2px rgba(0,0,0,0.05);
  }

  /* 7. SECTION TITLE */
  .section-title {
    margin: 45px 0 20px;      
    padding: 0 0 10px 0;       
    background: transparent;      
    border-bottom: 2px solid rgba(255,255,255,0.6); 
    font-size: 18px;          
    font-weight: 700;        
    color: #0f172a;              
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 20px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 4px;
    box-shadow: 0 2px 4px rgba(16,185,129,0.3);
  }

  /* 8. TOMBOL UTAMA */
  .btn-submit {
    margin-top: 30px;
    padding: 16px 24px;
    background: rgba(16, 185, 129, 0.85); 
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.4); 
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    width: 100%;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    background: rgba(16, 185, 129, 0.95);
    box-shadow: 0 12px 24px rgba(16, 185, 129, 0.4);
  }

  /* 9. BARIS DINAMIS APH */
  .aph-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto; 
    gap: 12px;
    align-items: center;
    margin-top: 12px;
    background: rgba(255, 255, 255, 0.3); 
    padding: 12px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    animation: fadeInSlide 0.4s ease forwards;
  }

  .aph-actions {
    display: flex;
    justify-content: flex-start; 
    gap: 10px; 
    margin: 12px 0 25px 0;
  }

/* ========================================================= */
  /* TOMBOL TAMBAH & HAPUS APH (GAYA KACA DENGAN ANIMASI HOVER) */
  /* ========================================================= */
  
  .btn-add-inline,
  .btn-delete-inline,
  .btn-delete-row {
    width: 110px !important;
    height: 36px !important;
    min-width: 110px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
    font-size: 14px !important;
    border-radius: 8px !important;
    /* Transisi super mulus ala Motion.dev */
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    font-weight: 600 !important;
    backdrop-filter: blur(5px) !important;
    -webkit-backdrop-filter: blur(5px) !important;
    cursor: pointer !important;
  }

  /* Animasi saat kursor mendekat (Hover) & Diklik (Active) */
  .btn-add-inline:hover,
  .btn-delete-inline:hover,
  .btn-delete-row:hover {
    transform: translateY(-2px) scale(1.02) !important; /* Tombol sedikit terangkat & membesar halus */
  }
  
  .btn-add-inline:active,
  .btn-delete-inline:active,
  .btn-delete-row:active {
    transform: translateY(0) scale(0.98) !important; /* Efek membal saat ditekan */
  }

  /* Tombol Tambah APH (Kaca Putih) */
  .btn-add-inline {
    background: rgba(255, 255, 255, 0.5) !important;
    color: #0f172a !important;
    border: 1px solid rgba(255, 255, 255, 0.7) !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02) !important;
  }
  .btn-add-inline:hover {
    background: rgba(255, 255, 255, 0.9) !important;
    box-shadow: 0 6px 15px rgba(0,0,0,0.08) !important;
  }

  /* Tombol Hapus APH (Kaca Merah Muda) */
  .btn-delete-inline,
  .btn-delete-row {
    background: rgba(253, 234, 234, 0.5) !important;
    color: #c62828 !important;
    border: 1px solid rgba(253, 234, 234, 0.7) !important;
    box-shadow: 0 2px 5px rgba(225, 29, 72, 0.02) !important;
  }
  .btn-delete-inline:hover,
  .btn-delete-row:hover {
    background: rgba(253, 234, 234, 0.9) !important;
    box-shadow: 0 6px 15px rgba(225, 29, 72, 0.12) !important;
  }
  
  .btn-add-inline {
    background: rgba(255, 255, 255, 0.6) !important;
    color: #0f172a !important;
    border: 1px solid rgba(255, 255, 255, 0.8) !important;
  }
  .btn-add-inline:hover {
    background: rgba(255, 255, 255, 0.9) !important;
  }

  .btn-delete-inline, .btn-delete-row {
    background: rgba(255, 228, 230, 0.6) !important;
    color: #e11d48 !important;
    border: 1px solid rgba(255, 228, 230, 0.8) !important;
  }
  .btn-delete-inline:hover, .btn-delete-row:hover {
    background: rgba(255, 228, 230, 0.9) !important;
  }

  /* 10. ANIMASI */
  @keyframes fadeInSlide {
    0% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ========================================================================= */
  /* 11. HALAMAN RINGKASAN & LOADING (DIKEMBALIKAN KE GAYA ASLI TAMPILAN AWAL)  */
  /* ========================================================================= */

  #summary-page {
    display: none;
    background: white;
    border-radius: 12px;
    padding: 25px;
    max-width: 650px;
    margin: 30px auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    animation: fadeIn 0.4s ease;
  }
  
  .summary-container h3 {
    text-align: center;
    color: #333;
    font-size: 22px;
    margin-bottom: 10px;
  }
  .summary-subtitle {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
  }

  .summary-category {
    padding: 15px 18px;
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s ease;
    color: #fff;
  }
  .summary-category h4 {
    font-size: 17px;
    display: flex;
    align-items: center;
    margin-top: 0;
    gap: 6px;
  }
  .summary-category p {
    margin: 6px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.3);
    padding-bottom: 4px;
    font-size: 0.95em;
  }
  .summary-category ul { list-style: none; padding: 0; margin: 0; }
  .summary-category ul li { display: flex; gap: 12px; align-items: flex-start; margin: 6px 0; color: #2c3e50; background: rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 6px; }
  .summary-category ul li strong { display: inline-block; min-width: 150px; font-weight: 700; color: #2c3e50; }
  .summary-category ul li span { color: #333; word-break: break-word; }
  
  .category-stok { background: linear-gradient(135deg, #d6eaff, #b8dcff); color: #1e3a5f; }
  .category-produksi { background: linear-gradient(135deg, #d6f5e3, #b8ebc7); color: #1e4620; }
  .category-perbanyakan { background: linear-gradient(135deg, #ccfbf1, #99f6e4); color: #115e59; } 
  .category-pemanfaatan { background: linear-gradient(135deg, #ffe7c2, #ffd89b); color: #5f3a00; }
  .category-sisa { background: linear-gradient(135deg, #e5d4ff, #d0b6ff); color: #3d1e70; }
  .summary-category:hover { transform: translateY(-3px); transition: transform 0.3s ease; }

  .summary-actions { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
  .btn-edit, .btn-confirm { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
  .btn-edit { background: #ffc107; color: #333; }
  .btn-edit:hover { background: #e0a800; }
  .btn-confirm { background: #28a745; color: white; }
  .btn-confirm:hover { background: #218838; }

  /* File & Foto Eviden Summary */
  .file-list { margin-top: 10px; }
  .file-item { display:flex; align-items:center; justify-content:space-between; background:#f4f7f2; border:1px solid #e0e5da; border-radius:8px; padding:6px 10px; margin-bottom:8px; gap:10px; }
  .file-left { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .file-thumb { width:38px; height:38px; object-fit:cover; border-radius:6px; border:1px solid #d6dccf; }
  .file-name { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#333; }
  .foto-summary { background:#d8a9a7; border-radius:10px; padding:12px; margin-top:12px; }
  .foto-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; margin-top:8px; }
  .foto-item { display:flex; align-items:center; gap:10px; background:white; border-radius:8px; border:1px solid #eee; padding:6px 8px; }
  .foto-thumb { width:46px; height:46px; object-fit:cover; border-radius:6px; border:1px solid #ddd; }
  .foto-name { font-size:13px; color:#644c4c; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Loading Overlay Asli */
  #loading-overlay.show { display: flex; opacity: 1; }
  #loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(3px);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    font-family: 'Poppins', sans-serif;
    transition: opacity 0.3s ease;
    opacity: 0;
  }
  .progress-bar-container {
    width: 80%;
    max-width: 400px;
    height: 10px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  #progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #007bff, #4caf50);
    transition: width 0.2s ease;
  }
  #progress-text { color: #333; font-size: 14px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
